name: Deploy Victoria Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-victoria
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Cloudflare Tunnel Client
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Setup SSH Config
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat <<EOF > ~/.ssh/config
          Host brhub-services
            HostName ssh.dev-br.xyz
            User stark
            ProxyCommand cloudflared access ssh --hostname %h
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no

          Host brhub-web
            HostName 192.168.0.112
            User stark
            ProxyJump brhub-services
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no
          EOF

      - name: Deploy files via rsync
        run: |
          rsync -avz --delete --rsync-path="sudo rsync" --chown=www:www \
            --exclude='.git*' \
            --exclude='.github' \
            --exclude='database/*.sqlite' \
            --exclude='database/*.sqlite-shm' \
            --exclude='database/*.sqlite-wal' \
            --exclude='database/*.log' \
            ./ brhub-web:/www/wwwroot/victoria.dev-br.xyz/

      - name: Configure Nginx and PHP runtime
        run: |
          ssh brhub-web 'bash -s' <<'REMOTE'
          set -Eeuo pipefail

          domain='victoria.dev-br.xyz'
          deploy_root='/www/wwwroot/victoria.dev-br.xyz'
          document_root="${deploy_root}/public"

          nginx_conf=$(sudo grep -RIl --include='*.conf' "server_name[^;]*${domain}" \
            /www/server/panel/vhost/nginx /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null | head -n 1 || true)

          if [ -z "${nginx_conf}" ]; then
            echo "Unable to locate the Nginx virtual host for ${domain}."
            exit 1
          fi

          backup_conf="${nginx_conf}.victoria-deploy-backup"
          sudo cp "${nginx_conf}" "${backup_conf}"

          rollback() {
            echo 'Configuration failed; restoring the previous Nginx virtual host.'
            sudo cp "${backup_conf}" "${nginx_conf}"
            sudo nginx -t || true
          }
          trap 'status=$?; if [ "${status}" -ne 0 ]; then rollback; fi' EXIT

          sudo sed -i -E \
            "0,/^[[:space:]]*root[[:space:]]+[^;]+;/s##    root ${document_root};#" \
            "${nginx_conf}"

          if sudo grep -qE '^[[:space:]]*index[[:space:]]+' "${nginx_conf}"; then
            sudo sed -i -E \
              "0,/^[[:space:]]*index[[:space:]]+[^;]+;/s##    index index.php index.html index.htm;#" \
              "${nginx_conf}"
          else
            root_line=$(sudo grep -nE '^[[:space:]]*root[[:space:]]+' "${nginx_conf}" | head -n 1 | cut -d: -f1)
            sudo sed -i "${root_line}a\\    index index.php index.html index.htm;" "${nginx_conf}"
          fi

          php_include=''
          while IFS= read -r candidate; do
            socket=$(sudo grep -oE 'unix:[^;[:space:]]+' "${candidate}" | head -n 1 | sed 's#^unix:##' || true)
            if [ -n "${socket}" ] && sudo test -S "${socket}"; then
              php_include="${candidate}"
              break
            fi
          done < <(sudo find /www/server -type f -name 'enable-php-[0-9][0-9].conf' \
            ! -name 'enable-php-00.conf' 2>/dev/null | sort -Vr)

          if [ -z "${php_include}" ]; then
            echo 'No running PHP-FPM socket has a matching Nginx include.'
            sudo ss -lx | grep -E 'php|cgi' || true
            exit 1
          fi

          runtime_dir="${deploy_root}/.runtime"
          runtime_include="${runtime_dir}/victoria-php-runtime.conf"
          sudo install -d -o root -g root -m 755 "${runtime_dir}"
          printf '%s\n' \
            'location ~ \.php$ {' \
            '    try_files $uri =404;' \
            '    include fastcgi_params;' \
            '    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;' \
            '    fastcgi_param DOCUMENT_ROOT $document_root;' \
            '    fastcgi_param SCRIPT_NAME $fastcgi_script_name;' \
            "    fastcgi_pass unix:${socket};" \
            '    fastcgi_index index.php;' \
            '}' | sudo tee "${runtime_include}" > /dev/null

          if sudo grep -qE 'enable-php-[0-9]+\.conf|victoria-php-runtime\.conf' "${nginx_conf}"; then
            sudo sed -i -E \
              "s#^([[:space:]]*)include[[:space:]]+[^;]*(enable-php-[0-9]+\.conf|victoria-php-runtime\.conf);#\1include ${runtime_include};#" \
              "${nginx_conf}"
          fi

          if ! sudo grep -qE 'victoria-php-runtime\.conf|fastcgi_pass' "${nginx_conf}"; then
            closing_line=$(sudo grep -nE '^[[:space:]]*}[[:space:]]*$' "${nginx_conf}" | tail -n 1 | cut -d: -f1)
            if [ -z "${closing_line}" ]; then
              echo 'Unable to find the end of the Nginx server block.'
              exit 1
            fi
            sudo sed -i "${closing_line}i\\    include ${runtime_include};" "${nginx_conf}"
          fi

          php_version=$(basename "${php_include}" | sed -E 's/enable-php-([0-9]+)\.conf/\1/')
          php_bin="/www/server/php/${php_version}/bin/php"
          if [ -z "${php_bin}" ] || ! "${php_bin}" -r "exit(extension_loaded('pdo_sqlite') ? 0 : 1);"; then
            echo 'PHP PDO SQLite is not enabled on the web server.'
            exit 1
          fi

          php_user=$(sudo stat -c '%U' "${socket}")
          php_group=$(sudo stat -c '%G' "${socket}")
          sudo install -d -o "${php_user}" -g "${php_group}" -m 750 "${deploy_root}/database"
          sudo chown -R "${php_user}:${php_group}" "${deploy_root}/database"

          smoke_output=$(cd "${deploy_root}" && \
            sudo -u "${php_user}" env APP_DEBUG=true "${php_bin}" -d display_errors=1 public/index.php 2>&1)
          if ! grep -q '<!DOCTYPE html>' <<<"${smoke_output}"; then
            echo 'The application failed its PHP runtime smoke test:'
            echo "${smoke_output}" | head -c 4000
            exit 1
          fi

          sudo nginx -t
          sudo rm -f "${backup_conf}"
          trap - EXIT
          REMOTE

      - name: Reload Nginx on Web Server
        run: |
          ssh brhub-web "sudo systemctl reload nginx"

      - name: Verify production health
        run: |
          homepage=$(curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            https://victoria.dev-br.xyz/)
          login=$(curl --fail --silent --show-error \
            https://victoria.dev-br.xyz/login.php)

          if ! grep -q '<!DOCTYPE html>' <<<"${homepage}" || \
             ! grep -q '<!DOCTYPE html>' <<<"${login}"; then
            echo 'Production returned an empty or invalid HTML response.'
            ssh brhub-web \
              "sudo tail -n 100 /www/wwwlogs/victoria.dev-br.xyz.error.log 2>/dev/null || true"
            ssh brhub-web \
              "sudo tail -n 100 /www/wwwroot/victoria.dev-br.xyz/database/php-error.log 2>/dev/null || true"
            ssh brhub-web '
              set +e
              nginx_conf=$(sudo grep -RIl --include="*.conf" "server_name[^;]*victoria.dev-br.xyz" \
                /www/server/panel/vhost/nginx /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null | head -n 1)
              runtime_include=$(sudo grep -oE "[^;[:space:]]*victoria-php-runtime\.conf" "${nginx_conf}" | tail -n 1)
              socket=$(sudo grep -oE "unix:[^;[:space:]]+" "${runtime_include}" | head -n 1 | sed "s#^unix:##")
              php_version=$(basename "${socket}" | sed -E "s/php-cgi-([0-9]+)\.sock/\1/")
              php_bin="/www/server/php/${php_version}/bin/php"
              php_user=$(sudo stat -c "%U" "${socket}")
              echo "Active PHP include and socket:"
              sudo cat "${runtime_include}"
              sudo stat -c "%U:%G %a %n" "${socket}" /www/wwwroot/victoria.dev-br.xyz/database
              echo "Relevant PHP-FPM pool settings:"
              sudo grep -RHE "^(user|group|listen|catch_workers_output|php_admin_.*(open_basedir|error_log|display_errors))" \
                "/www/server/php/${php_version}/etc" 2>/dev/null | head -n 120
              echo "Direct origin response:"
              curl -sS -D - -H "Host: victoria.dev-br.xyz" http://127.0.0.1/index.php | head -c 2500
              echo
              if command -v cgi-fcgi >/dev/null 2>&1; then
                echo "Direct PHP-FPM response:"
                sudo -u "${php_user}" env REQUEST_METHOD=GET \
                  SCRIPT_FILENAME=/www/wwwroot/victoria.dev-br.xyz/public/index.php \
                  SCRIPT_NAME=/index.php SERVER_NAME=victoria.dev-br.xyz \
                  cgi-fcgi -bind -connect "${socket}" 2>&1 | head -c 2500
                echo
              fi
              echo "Running production entry point as ${php_user} with PHP ${php_version}:"
              cd /www/wwwroot/victoria.dev-br.xyz
              sudo -u "${php_user}" env APP_DEBUG=true "${php_bin}" -d display_errors=1 public/index.php 2>&1 | head -c 4000
              echo
              echo "Recent PHP runtime logs:"
              sudo find "/www/server/php/${php_version}/var/log" -type f -mmin -15 \
                -print -exec tail -n 60 {} \; 2>/dev/null | tail -n 240
            '
            exit 1
          fi
